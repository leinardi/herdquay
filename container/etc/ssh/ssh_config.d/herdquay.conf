# GitHub over SSH with HerdQuay's own key, delivered as a secret file at run time (never in the
# image). Host keys are verified against GitHub's published keys, shipped in
# /etc/ssh/ssh_known_hosts; a changed GitHub host key fails the connection instead of prompting.
Host github.com
	User git
	IdentityFile /run/secrets/github_ssh_key
	IdentitiesOnly yes
	StrictHostKeyChecking yes
	GlobalKnownHostsFile /etc/ssh/ssh_known_hosts
	UserKnownHostsFile /dev/null
