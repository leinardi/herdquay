# Trivy findings the release and scheduled scans accept. Both scans run with --ignore-unfixed, so
# only a HIGH or CRITICAL vulnerability that has a fix somewhere upstream can fail them. An entry
# here is the only other exception, and every entry must say, in its statement, why the finding does
# not apply or cannot be fixed here yet, and carry an expiry date that Trivy enforces, after which
# the finding fails the scans again. Each entry is scoped to the paths it was found in, so the same
# CVE in a tool added later still fails.
#
# The entries below are fixed in a dependency but not yet in a release of the tool that bundles it:
# the pinned version is the latest, or one held back on purpose (docs/updating.md). Review them
# when they expire: bump the tool if a fixed release is out, otherwise extend the date.
vulnerabilities:
