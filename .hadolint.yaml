failure-threshold: style
# A missing label is only info by default, which failure-threshold would let through.
override:
  error:
    - DL3049
ignored:
  # Pin versions in apt-get install. The base is Ubuntu 26.04, pinned by tag, and its apt sources
  # float with every security update, so an exact version pin breaks the build as soon as Ubuntu
  # publishes a fix. Reproducibility comes from the LTS release and the pinned, checksummed
  # downloads instead (the Docker CLI's own repository is pinned exactly).
  - DL3008
# The seven OCI labels of the shipped image, each required (DL3049 when missing) and validated;
# strict-labels rejects any label not listed here.
label-schema:
  org.opencontainers.image.title: text
  org.opencontainers.image.description: text
  org.opencontainers.image.source: url
  org.opencontainers.image.version: text
  org.opencontainers.image.revision: text
  org.opencontainers.image.created: text
  org.opencontainers.image.licenses: spdx
strict-labels: true
