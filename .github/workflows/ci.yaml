name: CI

# The authoritative checks run on every pull request and every push to main; the reviewdog jobs only
# annotate pull requests. ci-result is the one check the branch ruleset requires.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A pull request's runs share one group per branch, so a newer push cancels the older run. Every
  # other run (a push to main, a dispatch) gets a group of its own: GitHub keeps only one pending
  # run per group, so a shared group would let a newer push replace a queued run, and a release
  # gate needs CI to have passed on that exact commit.
  group: "${{ github.workflow }} @ ${{ github.event_name == 'pull_request' && github.event.pull_request.head.label || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  # The authoritative lint gate: every pre-commit hook over every file. The hooks bring their own
  # tools (pre-commit installs them, droast built with the runner's Rust toolchain), except
  # ShellCheck for droast's required bridge, which runs the pinned binary installed below;
  # actionlint runs the same shellcheck over the workflows' run: scripts. A hook that runs in a
  # dedicated job instead is listed in SKIP with the job's name.
  pre-commit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The id gives the resolved Python version, which is part of the cache key.
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit==4.6.2

      # droast's ShellCheck bridge and actionlint run the shellcheck on PATH: the pinned one, not
      # the runner's. The version is the shellcheck-py rev's in .pre-commit-config.yaml; the
      # action's default sha256 is that release's.
      - name: Set up ShellCheck
        uses: leinardi/gh-composite-actions/setup-shellcheck@601a374562bab71a2e17527fa2c24e6247f4a3fc # v1.1.0
        with:
          version: v0.11.0

      # Restore only: pre-commit-warmup.yaml saves the entry on main under the same key, with the
      # same python_version and pre-commit version as above. The hook environments are bound to the
      # interpreter that built them, so the resolved Python version is part of the key.
      - name: Restore the pre-commit cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ steps.python.outputs.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every pre-commit hook on every file
        run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit fails a hook that modifies a tracked file, which covers the auto-fixing hooks
      # (markdownlint fix, prettier); this also fails on a file a hook creates, which its diff check
      # does not see, so no fix can pass silently.
      - name: Fail if a hook modified a file
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Reports inline PR review comments over a diff range; a push or a manual dispatch has neither a
  # pull request to comment on nor a base ref to diff against. Annotation only: pre-commit-all is
  # the gate, so none of these jobs is needed by ci-result.
  actionlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # droast's ShellCheck bridge runs the shellcheck on PATH: the pinned one, not the runner's.
      - name: Set up ShellCheck
        uses: leinardi/gh-composite-actions/setup-shellcheck@601a374562bab71a2e17527fa2c24e6247f4a3fc # v1.1.0
        with:
          version: v0.11.0

      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: |
            check-merge-conflict
            end-of-file-fixer
            trailing-whitespace
            check-yaml
            check-json
            check-toml
            check-added-large-files
            dclint
            droast

  markdownlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    # Every commit in the pull request must follow Conventional Commits with a
    # scope: the release version is derived from commit types, and every commit
    # lands on main as it is. The local commit-msg hook only runs where
    # `make pre-commit-install` was run; this job is the check no commit skips.
    # It runs the repository's own conventional-pre-commit hook and skips merge
    # commits. No pull-request title check: squash merging is disabled.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@77e6e852b85ad28aa05bba731fa11be3305a5dac # v2.0.0
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}

  # Decides whether the image job runs on a pull request: only when something that goes into the
  # image or its tests changed, so a docs-only pull request skips the build. A push to main and a
  # manual dispatch always build: release.yaml gates on ci-result of the exact commit it releases
  # (require-ci-green), and only a full image job on that commit proves its image passed the suite.
  # A skip on a push would only say "no input changed since the previous push", whose own CI may
  # have failed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List the changed paths
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          image_paths='^(Dockerfile|\.dockerignore|compose[^/]*\.ya?ml|Makefile|droast\.toml|\.github/workflows/ci\.yaml)$|^(container|tests|scripts|\.mk)/'
          if [[ ${EVENT} != pull_request ]]; then
            echo "A ${EVENT} run always builds the image: the release gates on it."
            echo "image=true" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${PR_BASE}" head="${PR_HEAD}"
          if [[ -z ${base} || ${base} =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No comparable base: building the image."
            echo "image=true" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          changed="$(git diff --name-only "${base}" "${head}")"
          if grep -Eq "${image_paths}" <<<"${changed}"; then
            echo "image=true" >>"${GITHUB_OUTPUT}"
          else
            echo "No image input changed: the image job is skipped."
            echo "image=false" >>"${GITHUB_OUTPUT}"
          fi

  # Builds the image and runs its automated tests: the smoke test (SSH, doctor, GitHub client
  # configuration, secrets, persistence), the supervision test (child death, bounded stop) and the
  # release's short smoke test. The release builds the same Dockerfile, default target, on the same
  # pinned base digest, and runs only the short one (docs/release.md). Every input is public (the
  # pinned ubuntu:26.04 digest and the pinned downloads), so the job needs no secret.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every FROM pinned by digest and every download verified, before minutes of building: the
      # release runs the same check, so CI and the release build on the same base.
      - name: Check the Dockerfile pins
        uses: leinardi/gh-composite-actions/check-pinned-bases@601a374562bab71a2e17527fa2c24e6247f4a3fc # v1.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The layer cache is CI's own scope, written only on main: a pull request reads it and never
      # writes it. The release builds under its own scope (release-herdquay) and never reads this.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: herdquay:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-herdquay
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=ci-herdquay,mode=max' || '' }}

      # The tests provision their secrets with POSIX ACLs (scripts/local-secrets.sh).
      - name: Install the ACL tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends acl

      - name: Smoke test
        env:
          HERDQUAY_IMAGE: herdquay:ci
        run: tests/smoke.sh

      - name: Supervision test
        env:
          HERDQUAY_IMAGE: herdquay:ci
        run: tests/supervision.sh

      # The release's own short test, so a change that breaks it fails here and not mid-release.
      - name: Release smoke test
        env:
          HERDQUAY_IMAGE: herdquay:ci
          HERDQUAY_EXPECT_VERSION: ci
          HERDQUAY_EXPECT_REVISION: ${{ github.sha }}
        run: tests/release-smoke.sh

  # The single required check: green only when every gating job succeeded. conventional-commits
  # only runs on pull requests, so it may be skipped on a push or a dispatch. image may be skipped
  # only when changes succeeded and said no image input changed, which it says on pull requests
  # only; any other skip, failure or cancellation fails the gate. A repository that adds a gating
  # job adds it to needs.
  ci-result:
    if: always()
    needs:
      - pre-commit-all
      - conventional-commits
      - changes
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failed="$(jq -r --arg event "${EVENT}" --argjson needs "${NEEDS}" '
            to_entries[]
            | select(.value.result != "success")
            | select(
                (
                  $event != "pull_request"
                  and .key == "conventional-commits"
                  and .value.result == "skipped"
                ) | not
              )
            | select(
                (
                  .key == "image"
                  and .value.result == "skipped"
                  and $needs.changes.result == "success"
                  and $needs.changes.outputs.image == "false"
                ) | not
              )
            | "\(.key): \(.value.result)"
          ' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Needed jobs did not succeed:"
            echo "${failed}"
            exit 1
          fi
          echo "Every needed job succeeded."
