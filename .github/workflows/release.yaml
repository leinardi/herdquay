name: Release herdquay

# One dispatch resolves the version, checks that CI passed on the commit, decides
# the release mode, builds the image once, smoke-tests and scans that exact
# image, tags, publishes the image and the GitHub release, and moves the
# `latest` pointers. One image (linux/amd64) and no release binaries.
#
# The order of the release job is deliberate: everything that can fail does so
# before the tag exists, because tags in this repository are immutable ("Immutable
# tags" ruleset: no update, no deletion, no bypass) and cannot be cleaned up after
# a failure. The image is built once, into a job-local registry, and smoke-tested
# and scanned there; only that digest is copied to GHCR, after the tag. Everything
# after the tag push reuses what is already published only once it is proven to
# be this run's, and never replaces it, so a re-run with the same explicit
# version finishes a failed publish. docs/release.md is the prose version of
# this, with the recovery procedure and why the full image tests run in CI only.
on:
  workflow_dispatch:
    inputs:
      # Left empty, the version comes from the Conventional Commits since the last
      # tag. An explicit one is checked for shape and for being higher than every
      # released version, and is how a recovery re-run names the version it failed
      # on. The first release needs one: there is no tag to derive it from.
      version:
        description: "Version, e.g. 0.1.0 or v0.1.0 (empty: derive from the commits)"
        required: false
      # Resolves the version, checks CI, builds, smoke-tests and scans the image,
      # and stops there: no tag is pushed and nothing is published.
      dry_run:
        description: "Dry run: build, test and scan, stop before the tag is pushed"
        type: boolean
        default: false

# One release at a time, and never cancelled. Two dispatches in flight together
# would each check "higher than every released version" against the same latest
# tag, both pass, and then publish in whatever order they happened to finish - a
# lower version landing last would take `latest` with it. A second dispatch waits
# for the first instead of racing it, and a run that has started is never killed
# part-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The one definition of a release tag: vMAJOR.MINOR.PATCH, strict SemVer core
  # with no leading zeros, no pre-release and no build metadata, the same regex
  # release-version and release-mode use. The late checks below filter the full
  # tag list through it with grep -E, never through a glob.
  RELEASE_TAG_REGEX: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  IMAGE_REPO: ghcr.io/leinardi/herdquay
  # The workflow every published artifact must come from. The guard job makes
  # every run of this file a run on refs/heads/main, so the keyless cosign
  # identity a sign in this run produces is exactly the one release-mode checks
  # a reused image for, and a signature or an attestation from any other workflow
  # or branch does not count.
  SIGNER_WORKFLOW: leinardi/herdquay/.github/workflows/release.yaml
  # The Dockerfile downloads linux-amd64 toolchains: one platform.
  PLATFORMS: linux/amd64
  # The job-local registries the image is built into, and a dry run copies to.
  # Pinned by index digest, like every image this workflow runs.
  REGISTRY_IMAGE: registry:3.1.2@sha256:c87f33837722a100572e95d7dc4bf539fc42cf68202b13c3bc03c0ff54c3a649
  LOCAL_IMAGE: localhost:5000/herdquay
  COPY_IMAGE: localhost:5001/herdquay
  # Copies the scanned index to GHCR with its digest. skopeo v1.24.1 is
  # released on GitHub but has no image on quay.io, so this is v1.22.3.
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.3-immutable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5

jobs:
  # workflow_dispatch lets the caller pick any branch, and the release job holds
  # contents: write, packages: write and an OIDC identity. Dispatched from a side
  # branch it would tag that branch's tree and publish it as a release and as the
  # image. This fails rather than skips, so such a run is red and not a green
  # no-op, and every other job waits on it.
  #
  # The ruleset cannot express this: tag protection stops a tag moving, not a tag
  # being created from the wrong commit. The second line of defence is the
  # `release` environment, whose deployment branch rule is configured by hand -
  # docs/release.md.
  #
  # Then the version: explicit, or derived by svu from the commits, and in both
  # cases higher than every release, unless it is the recovery of this exact tag
  # on this commit (release-version).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
      explicit: ${{ steps.version.outputs.explicit }}
      recovery: ${{ steps.version.outputs.recovery }}
      major: ${{ steps.major.outputs.major }}

    steps:
      - name: Refuse to release anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "A release runs from main only (got $REF). Nothing was tagged or published." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-version reads every tag and the commits since the last one.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Only to derive a version: a version typed by hand releases even while
      # GitHub's release downloads fail.
      - name: Install svu
        if: inputs.version == ''
        uses: leinardi/gh-composite-actions/setup-svu@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2

      - name: Resolve the version to release
        id: version
        uses: leinardi/gh-composite-actions/release-version@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          version: ${{ inputs.version }}

      # The image's moving major tag is the bare number (:0, :1), as it has always
      # been; release-version's `major` output is the git form (v0).
      - name: Name the image major tag
        id: major
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

  # The release-time lint and full image tests are replaced by this gate: CI
  # (ci.yaml) must have passed on this exact commit, on its push to main. Its
  # ci-result needs pre-commit-all and the image job, which on a push to main
  # always builds this Dockerfile on the same pinned base digest and runs the
  # full smoke and supervision suites (docs/release.md, "What CI proves").
  ci-green:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read

    steps:
      - name: Require CI green on this commit
        uses: leinardi/gh-composite-actions/require-ci-green@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          accepted-events: push

  release:
    needs:
      - guard
      - ci-green
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Created on first run with no protection rules, which changes nothing by
    # itself. Add a deployment branch rule limiting it to `main`, and required
    # reviewers if a release should need a second pair of eyes - docs/release.md.
    environment: release
    permissions:
      contents: write # push the tag, create the release
      packages: write # push the image to GHCR
      id-token: write # cosign keyless signing and provenance via GitHub OIDC
      attestations: write # provenance attestation upload

    steps:
      # No persisted credentials: the one step that writes to the repository, the
      # tag push, passes the token to that one git command.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-mode reads the tag and its annotation from the clone.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Everything stamped into the image comes from the commit, never from the
      # clock or the clone.
      - name: Read the commit's dates
        id: stamp
        run: |
          set -euo pipefail
          {
            echo "build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"

      # Every FROM pinned by digest and every download verified (the same check
      # CI runs), so the release builds on the base CI tested.
      - name: Check the Dockerfile pins
        uses: leinardi/gh-composite-actions/check-pinned-bases@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2

      # The base the final image is built on: the line the release notes carry. The provenance check below asserts the build
      # really used it.
      - name: Read the base pin
        id: base
        run: |
          set -euo pipefail
          BASES=$(sed -nE 's/^FROM[[:space:]]+([^[:space:]]+@sha256:[0-9a-f]{64})[[:space:]]+AS[[:space:]]+base[[:space:]]*$/\1/Ip' Dockerfile)
          if [ "$(grep -c . <<<"$BASES")" -ne 1 ]; then
            echo "The Dockerfile must have exactly one 'FROM <image>@sha256:<digest> AS base' line (found: ${BASES:-none})." >&2
            exit 1
          fi
          echo "Base: $BASES"
          echo "image=$BASES" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The mode is decided here, before anything is built or pushed, from the Git
      # tag, the image :<tag> on GHCR and the GitHub release. Only "not found"
      # counts as absent: any other lookup error stops the run. It also installs
      # cosign v3, which signs below.
      #
      #   Git tag         published                                  mode
      #   absent          nothing                                    fresh
      #   absent          an image, or a release                     stop
      #   on another commit                                          stop
      #   on this commit  image attested and signed for this commit  reuse
      #   on this commit  image present, not attested or signed      stop: needs a human
      #   on this commit  no image                                   publish
      #
      # docs/release.md describes each mode.
      - name: Decide the release mode
        id: mode
        uses: leinardi/gh-composite-actions/release-mode@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          tag: ${{ needs.guard.outputs.tag }}
          image: ${{ env.IMAGE_REPO }}
          platforms: ${{ env.PLATFORMS }}
          signer-workflow: ${{ env.SIGNER_WORKFLOW }}
          dry-run: ${{ inputs.dry_run }}

      # The published digest a reuse continues with, from the plan.
      - name: Read the reused digest
        id: reused
        if: steps.mode.outputs.mode == 'reuse'
        env:
          PLAN: ${{ steps.mode.outputs.plan-file }}
        run: |
          set -euo pipefail
          DIGEST=$(jq -r '.images[0].digest // empty' "$PLAN")
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The plan names no published digest to reuse (got '$DIGEST')." >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The annotated tag, in the clone only, until the point of no return below.
      # On a recovery it is already here: release-mode checked it is on this commit.
      - name: Create the tag locally
        if: steps.mode.outputs.tag-exists != 'true'
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "herdquay $TAG"

      # Host network, so the builder reaches the job-local registry on localhost.
      - name: Set up Buildx
        if: steps.mode.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      # The image is built once, into a registry that lives and dies with this
      # job, and only the digest that was tested and scanned is copied to GHCR. A
      # dry run starts a second one to exercise that copy.
      - name: Start the job-local registries
        if: steps.mode.outputs.build == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          docker run -d --name local-registry -p 5000:5000 "$REGISTRY_IMAGE"
          PORTS=(5000)
          if [ "$DRY_RUN" = "true" ]; then
            docker run -d --name copy-registry -p 5001:5000 "$REGISTRY_IMAGE"
            PORTS+=(5001)
          fi
          for port in "${PORTS[@]}"; do
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://localhost:$port/v2/"; then
                continue 2
              fi
              sleep 1
            done
            echo "The job-local registry on port $port did not come up." >&2
            exit 1
          done

      # The only image build: the Dockerfile's default target, as CI builds it.
      # Pushed by digest with no tag, with the SBOM and mode=max provenance in the
      # index. Every layer is recompressed as gzip: for a zstd layer skopeo
      # rewrites the index entries with a compression annotation, which
      # --preserve-digests then refuses, so the copy below could not keep the
      # tested digest. The layer cache is the release's own scope, which only
      # this workflow reads and writes.
      - name: Build the image into the job-local registry
        id: build
        if: steps.mode.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # push=true inside `outputs` instead of the `push` input: `push` adds a
          # second, tagged registry exporter.
          outputs: type=image,name=${{ env.LOCAL_IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=gzip,force-compression=true
          platforms: ${{ env.PLATFORMS }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-herdquay
          cache-to: type=gha,scope=release-herdquay,mode=max
          build-args: |
            VERSION=${{ needs.guard.outputs.tag }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.stamp.outputs.build_date }}
            SOURCE_DATE_EPOCH=${{ steps.stamp.outputs.source_date_epoch }}

      # The images the build pulled, read from the provenance of the index it
      # pushed, must be exactly the Dockerfile's digest pins (the base and the
      # frontend): no tag resolved to anything CI did not build on. BuildKit's
      # SBOM scanner (docker/buildkit-syft-scanner) is listed too; it generates
      # the SBOM attestation and is not part of the image.
      - name: Check the build used the pinned images
        if: steps.mode.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          PINS=$({
            sed -nE 's/^FROM[[:space:]]+[^[:space:]]+@(sha256:[0-9a-f]{64}).*/\1/Ip' Dockerfile
            sed -nE '1s/^#[[:space:]]*syntax=[^[:space:]]+@(sha256:[0-9a-f]{64}).*/\1/p' Dockerfile
          } | sort -u)
          PROVENANCE=$(docker buildx imagetools inspect "$LOCAL_IMAGE@$DIGEST" --format '{{json .Provenance}}')
          USED=$(jq -r '
            (.SLSA // .[env.PLATFORMS].SLSA)
            | (.materials // .buildDefinition.resolvedDependencies // [])[]
            | select(.uri | startswith("pkg:docker/"))
            | select(.uri | startswith("pkg:docker/docker/buildkit-syft-scanner@") | not)
            | "sha256:\(.digest.sha256)"
          ' <<<"$PROVENANCE" | sort -u)
          if [ -z "$USED" ]; then
            echo "The provenance of $DIGEST lists no image the build pulled." >&2
            exit 1
          fi
          if [ "$USED" != "$PINS" ]; then
            echo "The build pulled images other than the Dockerfile's pins." >&2
            echo "Pinned:" >&2
            echo "$PINS" >&2
            echo "Pulled (provenance):" >&2
            echo "$USED" >&2
            exit 1
          fi
          echo "The build pulled exactly the pinned images:"
          echo "$USED"

      # The platform image of the index, by its own digest: what is tested and
      # scanned below is exactly what is copied to GHCR.
      - name: Resolve the platform image
        id: platform
        if: steps.mode.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          INDEX=$(docker buildx imagetools inspect "$LOCAL_IMAGE@$DIGEST" --format '{{json .Manifest}}')
          PLATFORM_DIGEST=$(jq -r --arg os "${PLATFORMS%%/*}" --arg arch "${PLATFORMS#*/}" \
            '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' \
            <<<"$INDEX")
          if [ -z "$PLATFORM_DIGEST" ]; then
            echo "The index $DIGEST has no single $PLATFORMS image." >&2
            exit 1
          fi
          echo "digest=$PLATFORM_DIGEST" >> "$GITHUB_OUTPUT"

      # The test provisions its secrets with POSIX ACLs (scripts/local-secrets.sh).
      - name: Install the ACL tools
        if: steps.mode.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends acl

      # The short smoke test, against the built digest pulled back from the
      # job-local registry rather than a second build: the labels name this
      # version and commit, the container turns healthy, SSH runs the tools and a
      # stop is clean. The full suite ran in CI (the ci-green job).
      - name: Smoke-test the built image
        if: steps.mode.outputs.build == 'true'
        env:
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
          HERDQUAY_IMAGE: herdquay:release
          HERDQUAY_EXPECT_VERSION: ${{ needs.guard.outputs.tag }}
          HERDQUAY_EXPECT_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$LOCAL_IMAGE@$PLATFORM_DIGEST"
          docker tag "$LOCAL_IMAGE@$PLATFORM_DIGEST" "$HERDQUAY_IMAGE"
          tests/release-smoke.sh
          docker image rm "$HERDQUAY_IMAGE" "$LOCAL_IMAGE@$PLATFORM_DIGEST" >/dev/null

      # A HIGH or CRITICAL finding with a fix upstream fails the run here, before
      # any tag exists, the base's own included. Unfixed findings do not. The only
      # exceptions are the ones committed in .trivyignore.yaml, each scoped to its
      # paths, with a reason and an expiry. Trivy is its latest release, never
      # pinned.
      - name: Scan the platform image
        if: steps.mode.outputs.build == 'true'
        uses: leinardi/gh-composite-actions/trivy-gate@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          image: ${{ env.LOCAL_IMAGE }}@${{ steps.platform.outputs.digest }}
          platform: ${{ env.PLATFORMS }}

      # The last look at the tags before the point of no return. Concurrency
      # serializes the workflow, but a tag can also arrive from outside it, and
      # the version was resolved before several minutes of building. This asks
      # the remote, not the local clone, and it asks now.
      - name: Gate the tag
        if: steps.mode.outputs.mode == 'fresh' || inputs.dry_run
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          EXISTS: ${{ steps.mode.outputs.tag-exists }}
        run: |
          set -euo pipefail

          # Its own assignment, so a failed ls-remote stops the step under
          # set -e instead of reading as "no tags"; only grep finding no release
          # tag is allowed to come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } \
            | sort -V \
            | tail -n1)

          if [ -z "$HIGHEST_REMOTE" ] || [ "$HIGHEST_REMOTE" = "$TAG" ]; then
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$TAG" "$HIGHEST_REMOTE" | sort -V | tail -n1)
          if [ "$HIGHEST" = "$TAG" ]; then
            exit 0
          fi

          # A recovery's tag is already on this commit and its artifacts are
          # legitimate; it finishes, and simply does not become latest.
          if [ "$EXISTS" = "true" ]; then
            echo "::notice::$HIGHEST_REMOTE is higher than $TAG. Finishing the recovery of $TAG, which will not become latest."
            exit 0
          fi

          echo "$HIGHEST_REMOTE was published while this run was building, so $TAG would be a lower immutable tag. Nothing was pushed; release a higher version." >&2
          exit 1

      # The image ownership check, right before the tag is pushed: the version
      # must not be held by an image, or the tag would point at a version this
      # run can never publish. Fail-closed: only "not found" reads as absent.
      - name: Check the version image is absent
        if: steps.mode.outputs.mode == 'fresh' || inputs.dry_run
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          if OUT=$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" 2>&1); then
            echo "$IMAGE_REPO:$TAG appeared while this run was building. Nothing was pushed; release a higher version - docs/release.md." >&2
            exit 1
          elif ! grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
            echo "Could not tell whether $IMAGE_REPO:$TAG exists: $OUT" >&2
            exit 1
          fi

      # The copy step below, against the second job-local registry instead of
      # GHCR, with the same checks: the digest survives, and so do the SBOM and
      # provenance manifests.
      - name: Rehearse the copy on a second local registry
        if: inputs.dry_run
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --network host "$SKOPEO_IMAGE" copy --all --preserve-digests \
            --src-tls-verify=false --dest-tls-verify=false \
            "docker://$LOCAL_IMAGE@$DIGEST" "docker://$COPY_IMAGE@$DIGEST"

          RAW=$(mktemp)
          docker run --rm --network host "$SKOPEO_IMAGE" inspect --raw --tls-verify=false \
            "docker://$COPY_IMAGE@$DIGEST" > "$RAW"
          COPIED="sha256:$(sha256sum < "$RAW" | cut -d' ' -f1)"
          if [ "$COPIED" != "$DIGEST" ]; then
            echo "The copied index is $COPIED, not the tested $DIGEST." >&2
            exit 1
          fi

          ATTESTATIONS=$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' "$RAW")
          WANT=$(tr ',' '\n' <<<"$PLATFORMS" | wc -l)
          if [ "$ATTESTATIONS" -ne "$WANT" ]; then
            echo "The copied index carries $ATTESTATIONS attestation manifests, want $WANT (one per platform)." >&2
            exit 1
          fi
          echo "Copied $DIGEST with its digest and $ATTESTATIONS attestation manifests intact."

      - name: Report what a real run would publish
        if: inputs.dry_run
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          PREVIOUS: ${{ needs.guard.outputs.previous }}
          EXPLICIT: ${{ needs.guard.outputs.explicit }}
          MODE: ${{ steps.mode.outputs.mode }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
          BASE: ${{ steps.base.outputs.image }}
        run: |
          set -euo pipefail
          {
            echo "# Dry run: $TAG"
            echo
            echo "Previous tag: ${PREVIOUS:-none}. Explicit version: $EXPLICIT. A real run would take the $MODE mode."
            echo
            echo "No tag was created and nothing was published. The image index $DIGEST was built on \`$BASE\` into a"
            echo "job-local registry, its $PLATFORMS image ($PLATFORM_DIGEST) was smoke-tested and scanned, and the index was"
            echo "copied to a second local registry with its digest and attestation manifests intact."
          } >> "$GITHUB_STEP_SUMMARY"

      # The point of no return. Everything after it reuses a published artifact
      # only once it is proven to be this run's and never replaces one, so a
      # re-run with the same explicit version finishes a failed publish. The
      # token reaches this one git command as a header, never the clone's config.
      - name: Push the tag
        if: ${{ !inputs.dry_run && steps.mode.outputs.mode == 'fresh' }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "refs/tags/$TAG"

      # The tested index, byte for byte, with no tag at all: a version tag is
      # only ever added once the digest has been attested and signed, so an
      # untagged digest left by a failed run is inert.
      - name: Copy the image to GHCR by digest
        if: ${{ !inputs.dry_run && steps.mode.outputs.build == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$HOME/.docker/config.json:/auth.json:ro" "$SKOPEO_IMAGE" \
            copy --all --preserve-digests --src-tls-verify=false --dest-authfile /auth.json \
            "docker://$LOCAL_IMAGE@$DIGEST" "docker://$IMAGE_REPO@$DIGEST"

      # What GHCR now serves under the digest is hashed here, not taken from a
      # tool's report, so the digest attested and signed below is the one that
      # was tested and scanned.
      - name: Check GHCR serves the tested index
        if: ${{ !inputs.dry_run && steps.mode.outputs.build == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          RAW=$(mktemp)
          docker run --rm -v "$HOME/.docker/config.json:/auth.json:ro" "$SKOPEO_IMAGE" \
            inspect --raw --authfile /auth.json "docker://$IMAGE_REPO@$DIGEST" > "$RAW"
          SERVED="sha256:$(sha256sum < "$RAW" | cut -d' ' -f1)"
          if [ "$SERVED" != "$DIGEST" ]; then
            echo "GHCR serves $SERVED for $IMAGE_REPO@$DIGEST, not the tested index. Nothing was tagged." >&2
            exit 1
          fi

      - name: Attest image provenance
        if: ${{ !inputs.dry_run && steps.mode.outputs.build == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A new digest is signed with this workflow's keyless identity. A reused one
      # already carries that signature: release-mode verified it, with its
      # attestation, before deciding to reuse it.
      - name: Sign the image with cosign (keyless via GitHub OIDC)
        id: sign
        if: ${{ !inputs.dry_run }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DIGEST: ${{ steps.reused.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "reuse" ]; then
            echo "$IMAGE_REPO@$DIGEST carries this workflow's attestation and signature: reusing it."
          else
            cosign sign --yes "$IMAGE_REPO@$DIGEST"
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The reused image is already immutable and published, so its scan cannot
      # stop anything: findings are reported as warnings, for a human to judge
      # whether the next version should follow sooner.
      - name: Scan the reused image
        id: reuse-scan
        if: ${{ !inputs.dry_run && steps.mode.outputs.mode == 'reuse' }}
        continue-on-error: true
        uses: leinardi/gh-composite-actions/trivy-gate@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.sign.outputs.digest }}
          platform: ${{ env.PLATFORMS }}

      - name: Warn about the reused image's findings
        if: ${{ !inputs.dry_run && steps.mode.outputs.mode == 'reuse' && steps.reuse-scan.outcome != 'success' }}
        env:
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          echo "::warning::The reused $IMAGE_REPO@$DIGEST has fixable HIGH or CRITICAL findings, or could not be scanned. It is already published and was not changed; consider releasing a new version."

      - name: Tag the image with the version
        if: ${{ !inputs.dry_run && steps.mode.outputs.build == 'true' }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          set -euo pipefail
          # Checked again right before tagging: a version tag that appeared since
          # the checks above is never overwritten.
          if OUT=$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" 2>&1); then
            echo "$IMAGE_REPO:$TAG appeared while this run was publishing. It was not overwritten: re-run to verify it, or hand it to a human - docs/release.md." >&2
            exit 1
          elif ! grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
            echo "Could not tell whether $IMAGE_REPO:$TAG exists: $OUT" >&2
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE_REPO:$TAG" "$IMAGE_REPO@$DIGEST"

      # The release carries no assets: the image is the artifact. It is created
      # as a draft if it does not exist yet, with the base it was built on above
      # the generated notes, and stays one until the latest checks below. An
      # asset on it means something outside this workflow touched it: that needs
      # a human.
      - name: Draft the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          BASE: ${{ steps.base.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! OUT=$(gh release view "$TAG" --json isDraft 2>&1); then
            if ! grep -qi 'release not found' <<<"$OUT"; then
              echo "Could not tell whether the release $TAG exists: $OUT" >&2
              exit 1
            fi
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "$TAG" \
              --notes "Built on \`$BASE\`."
          fi
          # Read into a variable first, so a failed lookup stops the step
          # instead of reading as "no assets".
          NAMES=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if [ -n "$NAMES" ]; then
            echo "The release $TAG carries assets this workflow never uploads: $NAMES. Nothing was changed; it needs a human." >&2
            exit 1
          fi

      # The moving pointers go last, each after its own fresh look at the remote:
      # a version that is no longer the highest does not take them. Best-effort,
      # not atomic - docs/release.md.
      - name: Move the image major and latest tags
        id: pointers
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          MAJOR: ${{ needs.guard.outputs.major }}
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under
          # set -e instead of reading as "no tags"; only grep finding no release
          # tag is allowed to come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } \
            | sort -V \
            | tail -n1)
          if [ "$HIGHEST_REMOTE" != "$TAG" ]; then
            echo "::notice::$HIGHEST_REMOTE is higher than $TAG, so :$MAJOR and :latest were left where they are."
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE_REPO:$MAJOR" -t "$IMAGE_REPO:latest" "$IMAGE_REPO@$DIGEST"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under
          # set -e instead of reading as "no tags"; only grep finding no release
          # tag is allowed to come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } \
            | sort -V \
            | tail -n1)
          LATEST=false
          if [ "$HIGHEST_REMOTE" = "$TAG" ]; then
            LATEST=true
          fi
          gh release edit "$TAG" --draft=false --latest="$LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      # GHCR tags and GitHub releases cannot be moved together atomically, so a
      # tag created outside this workflow between the two moves above can leave
      # them disagreeing. Nothing is moved back: this run cannot know that the
      # other version's image exists or is trustworthy. It says so instead.
      - name: Check that the pointers agree
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          MAJOR: ${{ needs.guard.outputs.major }}
          MOVED: ${{ steps.pointers.outputs.moved }}
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under
          # set -e instead of reading as "no tags"; only grep finding no release
          # tag is allowed to come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } \
            | sort -V \
            | tail -n1)
          if [ "$MOVED" = "true" ] && [ "$HIGHEST_REMOTE" != "$TAG" ]; then
            echo "::warning::$HIGHEST_REMOTE was tagged while $TAG was publishing. The image :latest and :$MAJOR may point at $TAG while GitHub marks another release Latest. Fix: re-dispatch $HIGHEST_REMOTE, whose own late checks repoint them; if that tag was created outside this workflow and has no image, retag by hand as docs/release.md describes."
          fi

      - name: Summarize the release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          PREVIOUS: ${{ needs.guard.outputs.previous }}
          RECOVERY: ${{ steps.mode.outputs.tag-exists }}
          MODE: ${{ steps.mode.outputs.mode }}
          DIGEST: ${{ steps.sign.outputs.digest }}
          BASE: ${{ steps.base.outputs.image }}
          MOVED: ${{ steps.pointers.outputs.moved }}
          LATEST: ${{ steps.publish.outputs.latest }}
        run: |
          set -euo pipefail
          {
            echo "# Released $TAG"
            echo
            echo "Previous tag: ${PREVIOUS:-none}. Recovery: $RECOVERY. Mode: $MODE. Base: \`$BASE\`."
            echo
            echo "- [Release](https://github.com/leinardi/herdquay/releases/tag/$TAG) - marked latest: $LATEST"
            echo "- [Image](https://github.com/leinardi/herdquay/pkgs/container/herdquay): \`$IMAGE_REPO:$TAG\` (\`$DIGEST\`) - :latest moved: $MOVED"
          } >> "$GITHUB_STEP_SUMMARY"
