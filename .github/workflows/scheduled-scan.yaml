name: Scheduled scan

# A release is scanned once, when it is built. Vulnerabilities are published
# every day, so the image people pull is scanned again every week, with the
# release's own scanner and settings. A failure fails the run, which is what
# makes it visible: fix it with a new release.
on:
  schedule:
    # Mondays, 06:17 UTC: off the hour, when scheduled runs pile up.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/leinardi/herdquay
  PLATFORMS: linux/amd64
  # Same pin as release.yaml, bumped by hand together with it.
  TRIVY_VERSION: v0.74.0

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # For .trivyignore.yaml, the same exceptions the release scan accepts.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      # :latest is resolved once, to its index digest, and the platform image is
      # scanned by its own digest: a :latest that moves during the run cannot mix
      # two releases into one result.
      - name: Scan the latest release
        run: |
          set -euo pipefail
          INDEX=$(docker buildx imagetools inspect "$IMAGE_REPO:latest" --format '{{json .Manifest}}')
          echo "$IMAGE_REPO:latest is $(jq -r '.digest' <<<"$INDEX")"
          PLATFORM_DIGEST=$(jq -r --arg os "${PLATFORMS%%/*}" --arg arch "${PLATFORMS#*/}" \
            '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' \
            <<<"$INDEX")
          if [ -z "$PLATFORM_DIGEST" ]; then
            echo "$IMAGE_REPO:latest has no single $PLATFORMS image." >&2
            exit 1
          fi
          echo "Scanning $PLATFORMS: $PLATFORM_DIGEST"
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --exit-code 1 --platform "$PLATFORMS" \
            "$IMAGE_REPO@$PLATFORM_DIGEST"
