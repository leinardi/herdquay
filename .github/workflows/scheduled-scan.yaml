name: Scheduled scan

# A release is scanned once, when it is built. Vulnerabilities are published
# every day, so the image people pull is scanned again every week, with the
# release's gate (trivy-gate, the latest Trivy, .trivyignore.yaml). A failure
# fails the run, which is what makes it visible: fix it with a new release.
on:
  schedule:
    # Mondays, 06:17 UTC: off the hour, when scheduled runs pile up.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/leinardi/herdquay
  PLATFORMS: linux/amd64

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # For .trivyignore.yaml, the same exceptions the release scan accepts.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # :latest is resolved once, to its index digest, and the platform image is
      # scanned by its own digest: a :latest that moves during the run cannot mix
      # two releases into one result.
      - name: Resolve the latest release
        id: latest
        run: |
          set -euo pipefail
          INDEX=$(docker buildx imagetools inspect "$IMAGE_REPO:latest" --format '{{json .Manifest}}')
          echo "$IMAGE_REPO:latest is $(jq -r '.digest' <<<"$INDEX")"
          PLATFORM_DIGEST=$(jq -r --arg os "${PLATFORMS%%/*}" --arg arch "${PLATFORMS#*/}" \
            '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' \
            <<<"$INDEX")
          if [ -z "$PLATFORM_DIGEST" ]; then
            echo "$IMAGE_REPO:latest has no single $PLATFORMS image." >&2
            exit 1
          fi
          echo "Scanning $PLATFORMS: $PLATFORM_DIGEST"
          echo "digest=$PLATFORM_DIGEST" >> "$GITHUB_OUTPUT"

      # The release's gate: every fixable HIGH or CRITICAL finding fails, the
      # base's included, since the fix for an inherited one is a release on the
      # base's newer digest. Trivy is its latest release,
      # never pinned, so every scan runs the newest checks.
      - name: Scan the latest release
        uses: leinardi/gh-composite-actions/trivy-gate@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.latest.outputs.digest }}
          platform: ${{ env.PLATFORMS }}
